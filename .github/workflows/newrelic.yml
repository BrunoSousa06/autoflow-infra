name: New Relic Pipeline

on:
  workflow_dispatch:
    inputs:
      apply:
        description: Aplicar o plan de New Relic aprovado neste run
        type: boolean
        required: true
        default: false
      approve_reconciliation:
        description: Aprovar import declarativo ou plano de recuperação de ownership New Relic divergente
        type: boolean
        required: true
        default: false
      allow_destructive:
        description: Autorizar desativação após inspeção e aprovação explícita
        type: boolean
        required: true
        default: false
  push:
    branches: [develop, main]

permissions:
  contents: read
  actions: read

concurrency:
  group: autoflow-eks-endpoint-deploy-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  gate:
    name: Validar CI aprovada e commit de origem
    if: >-
      (github.event_name == 'workflow_dispatch' &&
       (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main') &&
       (github.ref != 'refs/heads/main' || github.ref_protected)) ||
      (github.event_name == 'push' &&
       (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main') &&
       (github.ref != 'refs/heads/main' || github.ref_protected))
    runs-on: ubuntu-latest
    outputs:
      branch: ${{ steps.validate.outputs.branch }}
      sha: ${{ steps.validate.outputs.sha }}
      environment: ${{ steps.validate.outputs.environment }}
      branch_protected: ${{ steps.validate.outputs.branch_protected }}
      auto_cd_enabled: ${{ steps.validate.outputs.auto_cd_enabled }}
    steps:
      - uses: actions/checkout@v4
      - name: Validar origem da CI e proteger main
        id: validate
        env:
          GITHUB_REF_PROTECTED: ${{ github.ref_protected }}
          CI_WORKFLOW_NAME: AutoFlow infra CI
          EXPECTED_REPOSITORY_ID: ${{ github.repository_id }}
          AUTO_CD_ENABLED_HOMOLOG: ${{ vars.AUTO_CD_ENABLED_HOMOLOG }}
          AUTO_CD_ENABLED_PRODUCTION: ${{ vars.AUTO_CD_ENABLED_PRODUCTION }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: python scripts/validate_cd_trigger.py

  validate:
    if: needs.gate.result == 'success' && (github.event_name == 'workflow_dispatch' || needs.gate.outputs.auto_cd_enabled == 'true')
    needs: gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.gate.outputs.sha }}
      - name: Confirmar checkout do commit validado
        env:
          DEPLOY_SHA: ${{ needs.gate.outputs.sha }}
        run: test "$(git rev-parse HEAD)" = "$DEPLOY_SHA"
      - run: python -m unittest discover -s scripts -p "test_github_environment_guards.py" -v
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.16.5"
          terraform_wrapper: false
      - run: python -m unittest discover -s scripts -p "test_terraform_backend_config.py" -v
      - run: python -m unittest discover -s scripts -p "test_newrelic_*.py" -v
      - run: python -m unittest discover -s scripts -p "test_ci_cd_workflow_matrix.py" -v
      - run: terraform fmt -check -recursive infra/newrelic
      - run: terraform -chdir=infra/newrelic init -backend=false -input=false -lockfile=readonly
      - run: terraform -chdir=infra/newrelic validate

  plan:
    if: needs.gate.result == 'success' && (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main') && (github.ref != 'refs/heads/main' || github.ref_protected) && (github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && needs.gate.outputs.auto_cd_enabled == 'true'))
    needs: [gate, validate]
    runs-on: ubuntu-latest
    outputs:
      initialized: ${{ steps.newrelic_state.outputs.initialized }}
    environment: ${{ github.ref == 'refs/heads/main' && 'production' || 'homolog' }}
    env:
      GITHUB_DEPLOYMENT_ENVIRONMENT: ${{ github.ref == 'refs/heads/main' && 'production' || 'homolog' }}
      DEPLOY_SHA: ${{ needs.gate.outputs.sha }}
      AWS_REGION: ${{ vars.AWS_REGION }}
      AWS_EXPECTED_ACCOUNT_ID: ${{ vars.AWS_EXPECTED_ACCOUNT_ID }}
      AWS_TERRAFORM_STATE_BUCKET: ${{ vars.AWS_TERRAFORM_STATE_BUCKET }}
      AWS_TF_STATE_KEY_INFRA: ${{ vars.AWS_TF_STATE_KEY_INFRA }}
      AWS_TF_STATE_KEY_NEWRELIC: ${{ vars.AWS_TF_STATE_KEY_NEWRELIC }}
      TF_STATE_BUCKET: ${{ vars.AWS_TERRAFORM_STATE_BUCKET }}
      TF_STATE_KEY: ${{ vars.AWS_TF_STATE_KEY_NEWRELIC }}
      EKS_LEASE_BUCKET: ${{ vars.AWS_TERRAFORM_STATE_BUCKET }}
      EKS_LEASE_KEY: ci/${{ github.ref == 'refs/heads/main' && 'production' || 'homolog' }}/eks-endpoint-lease-newrelic-${{ github.run_id }}-${{ github.run_attempt }}-plan.json
      EKS_CLUSTER_NAME: eks-${{ github.ref == 'refs/heads/main' && 'autoflow-production' || 'autoflow' }}
      TF_VAR_aws_region: ${{ vars.AWS_REGION }}
      TF_VAR_aws_allowed_account_ids: '["${{ vars.AWS_EXPECTED_ACCOUNT_ID }}"]'
      TF_VAR_enable_newrelic_kubernetes: ${{ vars.ENABLE_NEWRELIC_KUBERNETES || 'false' }}
      TF_VAR_enable_newrelic_account_resources: ${{ vars.ENABLE_NEWRELIC_ACCOUNT_RESOURCES || 'false' }}
      TF_VAR_newrelic_account_id: ${{ vars.NEW_RELIC_ACCOUNT_ID || 'null' }}
      TF_VAR_newrelic_region: ${{ vars.NEW_RELIC_REGION }}
      TF_VAR_newrelic_api_key: ${{ secrets.NEW_RELIC_API_KEY }}
      TF_VAR_newrelic_environment: ${{ github.ref == 'refs/heads/main' && 'production' || 'homolog' }}
      TF_VAR_newrelic_synthetic_url: ${{ vars.NEW_RELIC_SYNTHETIC_URL }}
      TF_VAR_newrelic_synthetic_locations: ${{ vars.NEW_RELIC_SYNTHETIC_LOCATIONS_JSON || '[]' }}
      TF_VAR_newrelic_api_gateway_dashboard_queries: ${{ vars.NEW_RELIC_API_GATEWAY_DASHBOARD_QUERIES_JSON || '[]' }}
      PLAN_ENCRYPTION_PASSPHRASE: ${{ secrets.TERRAFORM_PLAN_ENCRYPTION_PASSPHRASE }}
      NEWRELIC_DEACTIVATION_APPROVED: ${{ github.event_name == 'workflow_dispatch' && inputs.apply && inputs.allow_destructive && 'true' || 'false' }}
      NEWRELIC_RECONCILIATION_APPROVED: ${{ github.event_name == 'workflow_dispatch' && inputs.approve_reconciliation && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.gate.outputs.sha }}
      - name: Confirmar checkout do commit aprovado pela CI
        run: test "$(git rev-parse HEAD)" = "$DEPLOY_SHA"
      - name: Validar configuração antes de acessar AWS
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
          TERRAFORM_APPLY_APPROVAL_CONFIGURED: ${{ vars.TERRAFORM_APPLY_APPROVAL_CONFIGURED }}
          AWS_TERRAFORM_STATE_BUCKET: ${{ vars.AWS_TERRAFORM_STATE_BUCKET }}
          AWS_TF_STATE_KEY_INFRA: ${{ vars.AWS_TF_STATE_KEY_INFRA }}
          AWS_TF_STATE_KEY_NEWRELIC: ${{ vars.AWS_TF_STATE_KEY_NEWRELIC }}
          NEW_RELIC_REGION: ${{ vars.NEW_RELIC_REGION }}
          TERRAFORM_PLAN_ENCRYPTION_PASSPHRASE: ${{ secrets.TERRAFORM_PLAN_ENCRYPTION_PASSPHRASE }}
          NEW_RELIC_API_KEY: ${{ secrets.NEW_RELIC_API_KEY }}
        run: |
          set -euo pipefail
          umask 077
          python scripts/validate_github_environment.py \
            --environment "$GITHUB_DEPLOYMENT_ENVIRONMENT" \
            --variable AWS_TF_STATE_KEY_INFRA \
            --variable AWS_TF_STATE_KEY_NEWRELIC \
            --variable NEW_RELIC_REGION \
            --variable TERRAFORM_APPLY_APPROVAL_CONFIGURED \
            --secret AWS_ACCESS_KEY_ID \
            --secret AWS_SECRET_ACCESS_KEY \
            --secret AWS_SESSION_TOKEN \
            --secret TERRAFORM_PLAN_ENCRYPTION_PASSPHRASE \
            --secret NEW_RELIC_API_KEY \
            --state-key AWS_TF_STATE_KEY_INFRA \
            --state-key AWS_TF_STATE_KEY_NEWRELIC
          python scripts/newrelic_pipeline_guard.py validate
          [[ "$TF_VAR_newrelic_region" == US || "$TF_VAR_newrelic_region" == EU ]]
          test "$TF_STATE_KEY" != "$AWS_TF_STATE_KEY_INFRA"
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Validar conta e região AWS esperadas
        run: |
          set -euo pipefail
          python scripts/verify_aws_account.py
          test "$(aws ec2 describe-availability-zones --region "$AWS_REGION" --query 'AvailabilityZones[0].RegionName' --output text)" = "$AWS_REGION"
          aws s3api head-bucket --bucket "$TF_STATE_BUCKET" --expected-bucket-owner "$AWS_EXPECTED_ACCOUNT_ID" --region "$AWS_REGION"
          test -n "$PLAN_ENCRYPTION_PASSPHRASE"
      - name: Descobrir cluster EKS e preencher input Terraform
        shell: bash
        run: |
          set -euo pipefail
          aws eks describe-cluster --name "$EKS_CLUSTER_NAME" --region "$AWS_REGION" >/dev/null
          printf 'TF_VAR_eks_cluster_name=%s\n' "$EKS_CLUSTER_NAME" >> "$GITHUB_ENV"
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.16.5"
          terraform_wrapper: false
      - uses: azure/setup-helm@v4
        with:
          version: v3.16.4
      - name: Inicializar e inspecionar states sem exibir conteúdo
        id: newrelic_state
        run: |
          set -euo pipefail
          umask 077
          cd infra
          terraform init -input=false -lockfile=readonly -backend-config="bucket=$TF_STATE_BUCKET" -backend-config="key=$AWS_TF_STATE_KEY_INFRA" -backend-config="region=$AWS_REGION" -backend-config="allowed_account_ids=$TF_VAR_aws_allowed_account_ids" -backend-config="encrypt=true" -backend-config="use_lockfile=true"
          terraform state pull > "$RUNNER_TEMP/legacy-state.json"
          cd newrelic
          terraform init -input=false -lockfile=readonly -backend-config="bucket=$TF_STATE_BUCKET" -backend-config="key=$TF_STATE_KEY" -backend-config="region=$AWS_REGION" -backend-config="allowed_account_ids=$TF_VAR_aws_allowed_account_ids" -backend-config="encrypt=true" -backend-config="use_lockfile=true"
          if aws s3api head-object --bucket "$TF_STATE_BUCKET" --key "$TF_STATE_KEY" --expected-bucket-owner "$AWS_EXPECTED_ACCOUNT_ID" >/dev/null 2>"$RUNNER_TEMP/newrelic-head-error"; then
            echo "initialized=true" >> "$GITHUB_OUTPUT"
            terraform state pull > "$RUNNER_TEMP/newrelic-state.json"
          elif grep -Eqi '404|NoSuchKey|Not Found' "$RUNNER_TEMP/newrelic-head-error"; then
            echo "initialized=false" >> "$GITHUB_OUTPUT"
            printf '{"version":4,"resources":[]}\n' > "$RUNNER_TEMP/newrelic-state.json"
          else
            echo "Não foi possível confirmar se o state New Relic existe; bloqueado." >&2
            exit 1
          fi
          rm -f "$RUNNER_TEMP/newrelic-head-error"
          chmod 600 "$RUNNER_TEMP/legacy-state.json" "$RUNNER_TEMP/newrelic-state.json"
      - name: Validar EKS ativo e acesso do runner
        run: |
          set -euo pipefail
          STATUS=$(aws eks describe-cluster --name "$EKS_CLUSTER_NAME" --region "$AWS_REGION" --query cluster.status --output text)
          test "$STATUS" = ACTIVE
          NODE_GROUPS=$(aws eks list-nodegroups --cluster-name "$EKS_CLUSTER_NAME" --region "$AWS_REGION" --query nodegroups --output text)
          test -n "$NODE_GROUPS"
          for NODE_GROUP in $NODE_GROUPS; do
            NG_STATUS=$(aws eks describe-nodegroup --cluster-name "$EKS_CLUSTER_NAME" --nodegroup-name "$NODE_GROUP" --region "$AWS_REGION" --query nodegroup.status --output text)
            test "$NG_STATUS" = ACTIVE
          done
      - name: Capturar IP do runner
        id: runner
        run: echo "ip=$(curl -4fsS https://checkip.amazonaws.com | tr -d '\n')" >> "$GITHUB_OUTPUT"
      - name: Reconciliar leases órfãos do endpoint EKS
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/eks_endpoint_access.py reconcile-orphans --region "$AWS_REGION" --cluster "$EKS_CLUSTER_NAME"
      - name: Autorizar temporariamente o runner no endpoint EKS
        id: authorize_eks
        env:
          RUNNER_IP: ${{ steps.runner.outputs.ip }}
        run: python scripts/eks_endpoint_access.py authorize --ip "$RUNNER_IP" --region "$AWS_REGION" --cluster "$EKS_CLUSTER_NAME"
      - name: Configurar acesso de leitura ao cluster para inventário remoto
        run: |
          set -euo pipefail
          aws eks update-kubeconfig --name "$EKS_CLUSTER_NAME" --region "$AWS_REGION" >/dev/null
      - name: Confirmar workloads AutoFlow antes de habilitar observabilidade
        run: |
          set -euo pipefail
          if [ "$TF_VAR_enable_newrelic_kubernetes" = true ] || [ "$TF_VAR_enable_newrelic_account_resources" = true ]; then
            python scripts/newrelic_pipeline_guard.py verify-workloads
          fi
      - name: Validar Secret Kubernetes antes da instalação Helm
        if: env.TF_VAR_enable_newrelic_kubernetes == 'true'
        run: |
          set -euo pipefail
          python scripts/newrelic_pipeline_guard.py verify-secret
      - name: Consultar release Helm sem imprimir o inventário
        id: helm_inventory
        run: |
          set -euo pipefail
          helm list --all-namespaces --output json > "$RUNNER_TEMP/helm-inventory.json"
          chmod 600 "$RUNNER_TEMP/helm-inventory.json"
          if python -c 'import json,sys; sys.exit(0 if any(x.get("name")=="newrelic-kubernetes" for x in json.load(open(sys.argv[1]))) else 1)' "$RUNNER_TEMP/helm-inventory.json"; then
            echo "present" > "$RUNNER_TEMP/helm-presence"
          else
            echo "absent" > "$RUNNER_TEMP/helm-presence"
          fi
      - name: Confirmar ausência de recursos remotos New Relic
        run: python scripts/newrelic_remote_guard.py --output "$RUNNER_TEMP/newrelic-account-inventory.json" > "$RUNNER_TEMP/newrelic-account-presence"
      - name: Validar ownership e preparar reconciliação declarativa
        run: |
          set -euo pipefail
          chmod 600 "$RUNNER_TEMP/newrelic-account-presence" "$RUNNER_TEMP/newrelic-account-inventory.json"
          python scripts/newrelic_state_guard.py \
            --old-state "$RUNNER_TEMP/legacy-state.json" \
            --new-state "$RUNNER_TEMP/newrelic-state.json" \
            --remote-helm "$(cat "$RUNNER_TEMP/helm-presence")" \
            --remote-account "$(cat "$RUNNER_TEMP/newrelic-account-presence")" \
            --allow-reconciliation "$NEWRELIC_RECONCILIATION_APPROVED"
          python scripts/newrelic_reconcile.py \
            --state "$RUNNER_TEMP/newrelic-state.json" \
            --inventory "$RUNNER_TEMP/newrelic-account-inventory.json" \
            --account-id "$TF_VAR_newrelic_account_id" \
            --environment "$TF_VAR_newrelic_environment" \
            --remote-helm "$(cat "$RUNNER_TEMP/helm-presence")" \
            --helm-inventory "$RUNNER_TEMP/helm-inventory.json" \
            --approve "$NEWRELIC_RECONCILIATION_APPROVED" \
            --imports-output infra/newrelic/newrelic-reconciliation.auto.tf \
            --summary-output "$RUNNER_TEMP/newrelic-reconciliation-summary.json" \
            --fingerprint-output infra/newrelic/newrelic-reconciliation.sha256
      - name: Fingerprint de configuração não secreta
        working-directory: infra/newrelic
        run: python ../../scripts/newrelic_pipeline_guard.py fingerprint newrelic-inputs.sha256
      - name: Gerar Plan protegido
        working-directory: infra/newrelic
        run: |
          set -euo pipefail
          terraform plan -input=false -no-color -out=newrelic.tfplan
          terraform show -json newrelic.tfplan > newrelic-plan.json
          python ../../scripts/newrelic_pipeline_guard.py check-plan newrelic-plan.json
          python ../../scripts/review_eks_plan.py newrelic-plan.json --allow-destructive "${{ inputs.allow_destructive || 'false' }}"
          printf '%s' "$GITHUB_SHA" > newrelic.tfplan.commit
          printf '%s\n' "$PLAN_ENCRYPTION_PASSPHRASE" | gpg --batch --yes --pinentry-mode loopback --passphrase-fd 0 --symmetric --cipher-algo AES256 --output newrelic.tfplan.gpg newrelic.tfplan
          sha256sum newrelic.tfplan.gpg newrelic.tfplan.commit newrelic-inputs.sha256 newrelic-reconciliation.sha256 > newrelic.tfplan.sha256
          rm -f newrelic.tfplan newrelic-plan.json
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: newrelic-tfplan-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}
          path: |
            infra/newrelic/newrelic.tfplan.gpg
            infra/newrelic/newrelic.tfplan.commit
            infra/newrelic/newrelic.tfplan.sha256
            infra/newrelic/newrelic-inputs.sha256
            infra/newrelic/newrelic-reconciliation.sha256
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
      - name: Limpar artefatos temporários e autorização do endpoint EKS
        if: always()
        run: |
          if [ "${{ steps.authorize_eks.outcome }}" != skipped ]; then
            python scripts/eks_endpoint_access.py cleanup --region "$AWS_REGION" --cluster "$EKS_CLUSTER_NAME"
          fi
          rm -f "$RUNNER_TEMP/legacy-state.json" "$RUNNER_TEMP/newrelic-state.json" "$RUNNER_TEMP/newrelic-account-presence" "$RUNNER_TEMP/newrelic-account-inventory.json" "$RUNNER_TEMP/newrelic-reconciliation-summary.json" "$RUNNER_TEMP/helm-presence" "$RUNNER_TEMP/helm-inventory.json" "$RUNNER_TEMP/newrelic-head-error" infra/newrelic/newrelic-reconciliation.auto.tf infra/newrelic/newrelic-reconciliation.sha256

  apply:
    if: needs.gate.result == 'success' && (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main') && github.event_name == 'workflow_dispatch' && inputs.apply == true && (github.ref != 'refs/heads/main' || github.ref_protected)
    needs: [gate, plan]
    runs-on: ubuntu-latest
    environment: ${{ github.ref == 'refs/heads/main' && 'production' || 'homolog' }}
    env:
      GITHUB_DEPLOYMENT_ENVIRONMENT: ${{ github.ref == 'refs/heads/main' && 'production' || 'homolog' }}
      DEPLOY_SHA: ${{ needs.gate.outputs.sha }}
      AWS_REGION: ${{ vars.AWS_REGION }}
      AWS_EXPECTED_ACCOUNT_ID: ${{ vars.AWS_EXPECTED_ACCOUNT_ID }}
      AWS_TERRAFORM_STATE_BUCKET: ${{ vars.AWS_TERRAFORM_STATE_BUCKET }}
      AWS_TF_STATE_KEY_INFRA: ${{ vars.AWS_TF_STATE_KEY_INFRA }}
      AWS_TF_STATE_KEY_NEWRELIC: ${{ vars.AWS_TF_STATE_KEY_NEWRELIC }}
      TF_STATE_BUCKET: ${{ vars.AWS_TERRAFORM_STATE_BUCKET }}
      TF_STATE_KEY: ${{ vars.AWS_TF_STATE_KEY_NEWRELIC }}
      EKS_LEASE_BUCKET: ${{ vars.AWS_TERRAFORM_STATE_BUCKET }}
      EKS_LEASE_KEY: ci/${{ github.ref == 'refs/heads/main' && 'production' || 'homolog' }}/eks-endpoint-lease-newrelic-${{ github.run_id }}-${{ github.run_attempt }}-apply.json
      EKS_CLUSTER_NAME: eks-${{ github.ref == 'refs/heads/main' && 'autoflow-production' || 'autoflow' }}
      TF_VAR_aws_region: ${{ vars.AWS_REGION }}
      TF_VAR_aws_allowed_account_ids: '["${{ vars.AWS_EXPECTED_ACCOUNT_ID }}"]'
      PLAN_ENCRYPTION_PASSPHRASE: ${{ secrets.TERRAFORM_PLAN_ENCRYPTION_PASSPHRASE }}
      TF_VAR_enable_newrelic_kubernetes: ${{ vars.ENABLE_NEWRELIC_KUBERNETES || 'false' }}
      TF_VAR_enable_newrelic_account_resources: ${{ vars.ENABLE_NEWRELIC_ACCOUNT_RESOURCES || 'false' }}
      TF_VAR_newrelic_account_id: ${{ vars.NEW_RELIC_ACCOUNT_ID || 'null' }}
      TF_VAR_newrelic_region: ${{ vars.NEW_RELIC_REGION }}
      TF_VAR_newrelic_api_key: ${{ secrets.NEW_RELIC_API_KEY }}
      TF_VAR_newrelic_environment: ${{ github.ref == 'refs/heads/main' && 'production' || 'homolog' }}
      TF_VAR_newrelic_synthetic_url: ${{ vars.NEW_RELIC_SYNTHETIC_URL }}
      TF_VAR_newrelic_synthetic_locations: ${{ vars.NEW_RELIC_SYNTHETIC_LOCATIONS_JSON || '[]' }}
      TF_VAR_newrelic_api_gateway_dashboard_queries: ${{ vars.NEW_RELIC_API_GATEWAY_DASHBOARD_QUERIES_JSON || '[]' }}
      NEWRELIC_RECONCILIATION_APPROVED: ${{ github.event_name == 'workflow_dispatch' && inputs.approve_reconciliation && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.gate.outputs.sha }}
      - name: Confirmar checkout do commit que gerou o Plan
        run: test "$(git rev-parse HEAD)" = "$DEPLOY_SHA"
      - name: Validar configuração e gate de aprovação
        env:
          TERRAFORM_APPLY_APPROVAL_CONFIGURED: ${{ vars.TERRAFORM_APPLY_APPROVAL_CONFIGURED }}
          AWS_TERRAFORM_STATE_BUCKET: ${{ vars.AWS_TERRAFORM_STATE_BUCKET }}
          AWS_TF_STATE_KEY_INFRA: ${{ vars.AWS_TF_STATE_KEY_INFRA }}
          AWS_TF_STATE_KEY_NEWRELIC: ${{ vars.AWS_TF_STATE_KEY_NEWRELIC }}
          NEW_RELIC_REGION: ${{ vars.NEW_RELIC_REGION }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
          TERRAFORM_PLAN_ENCRYPTION_PASSPHRASE: ${{ secrets.TERRAFORM_PLAN_ENCRYPTION_PASSPHRASE }}
          NEW_RELIC_API_KEY: ${{ secrets.NEW_RELIC_API_KEY }}
        run: |
          set -euo pipefail
          umask 077
          python scripts/validate_github_environment.py \
            --environment "$GITHUB_DEPLOYMENT_ENVIRONMENT" \
            --variable AWS_TF_STATE_KEY_INFRA \
            --variable AWS_TF_STATE_KEY_NEWRELIC \
            --variable NEW_RELIC_REGION \
            --variable TERRAFORM_APPLY_APPROVAL_CONFIGURED \
            --secret AWS_ACCESS_KEY_ID \
            --secret AWS_SECRET_ACCESS_KEY \
            --secret AWS_SESSION_TOKEN \
            --secret TERRAFORM_PLAN_ENCRYPTION_PASSPHRASE \
            --secret NEW_RELIC_API_KEY \
            --state-key AWS_TF_STATE_KEY_INFRA \
            --state-key AWS_TF_STATE_KEY_NEWRELIC \
            --approval-gate
          python scripts/newrelic_pipeline_guard.py validate
          [[ "$TF_VAR_newrelic_region" == US || "$TF_VAR_newrelic_region" == EU ]]
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Descobrir cluster EKS e preencher input Terraform
        shell: bash
        run: |
          set -euo pipefail
          python scripts/verify_aws_account.py
          test "$(aws ec2 describe-availability-zones --region "$AWS_REGION" --query 'AvailabilityZones[0].RegionName' --output text)" = "$AWS_REGION"
          aws s3api head-bucket --bucket "$TF_STATE_BUCKET" --expected-bucket-owner "$AWS_EXPECTED_ACCOUNT_ID" --region "$AWS_REGION"
          aws eks describe-cluster --name "$EKS_CLUSTER_NAME" --region "$AWS_REGION" >/dev/null
          printf 'TF_VAR_eks_cluster_name=%s\n' "$EKS_CLUSTER_NAME" >> "$GITHUB_ENV"
      - name: Capturar IP do runner
        id: runner
        run: echo "ip=$(curl -4fsS https://checkip.amazonaws.com | tr -d '\n')" >> "$GITHUB_OUTPUT"
      - name: Reconciliar leases órfãos do endpoint EKS
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/eks_endpoint_access.py reconcile-orphans --region "$AWS_REGION" --cluster "$EKS_CLUSTER_NAME"
      - name: Autorizar temporariamente o runner no endpoint EKS
        id: authorize_eks
        env:
          RUNNER_IP: ${{ steps.runner.outputs.ip }}
        run: python scripts/eks_endpoint_access.py authorize --ip "$RUNNER_IP" --region "$AWS_REGION" --cluster "$EKS_CLUSTER_NAME"
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.16.5"
          terraform_wrapper: false
      - uses: azure/setup-helm@v4
        with:
          version: v3.16.4
      - uses: actions/download-artifact@v4
        with:
          name: newrelic-tfplan-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}
          path: infra/newrelic
      - name: Conferir artifact e vinculação ao commit
        working-directory: infra/newrelic
        run: |
          set -euo pipefail
          test "$(cat newrelic.tfplan.commit)" = "$DEPLOY_SHA"
          sha256sum --check newrelic.tfplan.sha256
          python ../../scripts/newrelic_pipeline_guard.py verify-fingerprint newrelic-inputs.sha256
          printf '%s\n' "$PLAN_ENCRYPTION_PASSPHRASE" | gpg --batch --yes --pinentry-mode loopback --passphrase-fd 0 --decrypt --output newrelic.tfplan newrelic.tfplan.gpg
      - name: Revalidar cluster, Secret e estados antes do Apply
        run: |
          set -euo pipefail
          umask 077
          python scripts/verify_aws_account.py
          test "$(aws ec2 describe-availability-zones --region "$AWS_REGION" --query 'AvailabilityZones[0].RegionName' --output text)" = "$AWS_REGION"
          STATUS=$(aws eks describe-cluster --name "$EKS_CLUSTER_NAME" --region "$AWS_REGION" --query cluster.status --output text)
          test "$STATUS" = ACTIVE
          NODE_GROUPS=$(aws eks list-nodegroups --cluster-name "$EKS_CLUSTER_NAME" --region "$AWS_REGION" --query nodegroups --output text)
          test -n "$NODE_GROUPS"
          for NODE_GROUP in $NODE_GROUPS; do
            NG_STATUS=$(aws eks describe-nodegroup --cluster-name "$EKS_CLUSTER_NAME" --nodegroup-name "$NODE_GROUP" --region "$AWS_REGION" --query nodegroup.status --output text)
            test "$NG_STATUS" = ACTIVE
          done
          aws eks update-kubeconfig --name "$EKS_CLUSTER_NAME" --region "$AWS_REGION" >/dev/null
          if [ "$TF_VAR_enable_newrelic_kubernetes" = true ] || [ "$TF_VAR_enable_newrelic_account_resources" = true ]; then
            python scripts/newrelic_pipeline_guard.py verify-workloads
          fi
          if [ "$TF_VAR_enable_newrelic_kubernetes" = true ]; then
            python scripts/newrelic_pipeline_guard.py verify-secret
          fi
          python scripts/newrelic_remote_guard.py --output "$RUNNER_TEMP/newrelic-account-inventory.json" > "$RUNNER_TEMP/newrelic-account-presence"
          helm list --all-namespaces --output json > "$RUNNER_TEMP/helm-inventory.json"
          chmod 600 "$RUNNER_TEMP/newrelic-account-presence" "$RUNNER_TEMP/newrelic-account-inventory.json" "$RUNNER_TEMP/helm-inventory.json"
          if python -c 'import json,sys; sys.exit(0 if any(x.get("name")=="newrelic-kubernetes" for x in json.load(open(sys.argv[1]))) else 1)' "$RUNNER_TEMP/helm-inventory.json"; then
            echo "present" > "$RUNNER_TEMP/helm-presence"
          else
            echo "absent" > "$RUNNER_TEMP/helm-presence"
          fi
          cd infra
          terraform init -input=false -lockfile=readonly -backend-config="bucket=$TF_STATE_BUCKET" -backend-config="key=$AWS_TF_STATE_KEY_INFRA" -backend-config="region=$AWS_REGION" -backend-config="allowed_account_ids=$TF_VAR_aws_allowed_account_ids" -backend-config="encrypt=true" -backend-config="use_lockfile=true"
          terraform state pull > "$RUNNER_TEMP/legacy-state.json"
          cd newrelic
          terraform init -input=false -lockfile=readonly -reconfigure -backend-config="bucket=$TF_STATE_BUCKET" -backend-config="key=$TF_STATE_KEY" -backend-config="region=$AWS_REGION" -backend-config="allowed_account_ids=$TF_VAR_aws_allowed_account_ids" -backend-config="encrypt=true" -backend-config="use_lockfile=true"
          if aws s3api head-object --bucket "$TF_STATE_BUCKET" --key "$TF_STATE_KEY" --expected-bucket-owner "$AWS_EXPECTED_ACCOUNT_ID" >/dev/null 2>"$RUNNER_TEMP/newrelic-head-error"; then
            terraform state pull > "$RUNNER_TEMP/newrelic-state.json"
          elif grep -Eqi '404|NoSuchKey|Not Found' "$RUNNER_TEMP/newrelic-head-error"; then
            printf '{"version":4,"resources":[]}\n' > "$RUNNER_TEMP/newrelic-state.json"
          else
            echo "Não foi possível confirmar o state New Relic; bloqueado." >&2
            exit 1
          fi
          chmod 600 "$RUNNER_TEMP/legacy-state.json" "$RUNNER_TEMP/newrelic-state.json"
          python ../../scripts/newrelic_state_guard.py \
            --old-state "$RUNNER_TEMP/legacy-state.json" \
            --new-state "$RUNNER_TEMP/newrelic-state.json" \
            --remote-helm "$(cat "$RUNNER_TEMP/helm-presence")" \
            --remote-account "$(cat "$RUNNER_TEMP/newrelic-account-presence")" \
            --allow-reconciliation "$NEWRELIC_RECONCILIATION_APPROVED"
          python ../../scripts/newrelic_reconcile.py \
            --state "$RUNNER_TEMP/newrelic-state.json" \
            --inventory "$RUNNER_TEMP/newrelic-account-inventory.json" \
            --account-id "$TF_VAR_newrelic_account_id" \
            --environment "$TF_VAR_newrelic_environment" \
            --remote-helm "$(cat "$RUNNER_TEMP/helm-presence")" \
            --helm-inventory "$RUNNER_TEMP/helm-inventory.json" \
            --approve "$NEWRELIC_RECONCILIATION_APPROVED" \
            --imports-output newrelic-reconciliation.auto.tf \
            --summary-output "$RUNNER_TEMP/newrelic-reconciliation-summary.json" \
            --fingerprint-output "$RUNNER_TEMP/newrelic-reconciliation.current.sha256"
          cmp "$RUNNER_TEMP/newrelic-reconciliation.current.sha256" newrelic-reconciliation.sha256
      - name: Aplicar somente o plan aprovado
        working-directory: infra/newrelic
        run: |
          set -euo pipefail
          terraform apply -input=false newrelic.tfplan
      - name: Limpar artefatos temporários e autorização do endpoint EKS
        if: always()
        run: |
          if [ "${{ steps.authorize_eks.outcome }}" != skipped ]; then
            python scripts/eks_endpoint_access.py cleanup --region "$AWS_REGION" --cluster "$EKS_CLUSTER_NAME"
          fi
          rm -f "$RUNNER_TEMP/legacy-state.json" "$RUNNER_TEMP/newrelic-state.json" "$RUNNER_TEMP/newrelic-account-presence" "$RUNNER_TEMP/newrelic-account-inventory.json" "$RUNNER_TEMP/newrelic-reconciliation-summary.json" "$RUNNER_TEMP/newrelic-reconciliation.current.sha256" "$RUNNER_TEMP/helm-presence" "$RUNNER_TEMP/helm-inventory.json" "$RUNNER_TEMP/newrelic-head-error" infra/newrelic/newrelic-reconciliation.auto.tf
