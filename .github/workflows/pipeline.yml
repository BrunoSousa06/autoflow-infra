name: Pipeline

on:
  push:
    branches: [develop, main, 'feature/**']
    paths-ignore:
      - .github/workflows/pipeline.yml
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [develop, main]
  workflow_dispatch:
    inputs:
      apply:
        description: Aplicar o plan de VPC/EKS após aprovação
        type: boolean
        default: false
      approve_state_bucket_creation:
        description: Permitir bootstrap do bucket de Terraform State quando ausente
        type: boolean
        default: false
      approve_eks_state_reconciliation:
        description: Autorizar imports de rede/acesso EKS somente para recursos inequivocamente correspondentes ao root
        type: boolean
        default: false
      allow_destructive:
        description: Autorizar exclusões/substituições após revisar o plan
        type: boolean
        required: true
        default: false

permissions:
  contents: read
  actions: read

concurrency:
  group: autoflow-eks-endpoint-deploy-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  validate:
    name: CI Terraform de VPC/EKS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python -m unittest discover -s scripts -p "test_verify_aws_account.py" -v
      - run: python -m unittest discover -s scripts -p "test_verify_eks_iam_roles.py" -v
      - run: python -m unittest discover -s scripts -p "test_terraform_state_contract.py" -v
      - run: python -m unittest discover -s scripts -p "test_terraform_deployment_fingerprint.py" -v
      - run: python -m unittest discover -s scripts -p "test_terraform_state_root_contracts.py" -v
      - run: python -m unittest discover -s scripts -p "test_eks_endpoint_access.py" -v
      - run: python -m unittest discover -s scripts -p "test_prepare_eks_access_imports.py" -v
      - run: python -m unittest discover -s scripts -p "test_prepare_eks_network_imports.py" -v
      - run: python -m unittest discover -s scripts -p "test_state_resource_guard.py" -v
      - run: python -m unittest discover -s scripts -p "test_review_eks_plan.py" -v
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.16.5"
          terraform_wrapper: false
      - run: terraform fmt -check -recursive infra
      - run: terraform -chdir=infra init -backend=false -input=false
      - run: terraform -chdir=infra validate

  plan:
    name: Terraform Plan protegido
    if: (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main') && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && (github.ref != 'refs/heads/main' || github.ref_protected)
    needs: validate
    runs-on: ubuntu-latest
    environment: ${{ github.ref == 'refs/heads/main' && 'production' || 'homolog' }}
    env:
      GITHUB_DEPLOYMENT_ENVIRONMENT: ${{ github.ref == 'refs/heads/main' && 'production' || 'homolog' }}
      AWS_REGION: ${{ vars.AWS_REGION }}
      TF_STATE_BUCKET: ${{ vars.AWS_TERRAFORM_STATE_BUCKET }}
      TF_STATE_KEY: ${{ vars.AWS_TF_STATE_KEY_INFRA }}
      TF_VAR_aws_allowed_account_ids: '["${{ vars.AWS_EXPECTED_ACCOUNT_ID }}"]'
      TF_VAR_project_name: ${{ github.ref == 'refs/heads/main' && 'autoflow-production' || 'autoflow' }}
      TF_VAR_region_default: ${{ vars.AWS_REGION }}
      EKS_CLUSTER_NAME: eks-${{ github.ref == 'refs/heads/main' && 'autoflow-production' || 'autoflow' }}
      EKS_LEASE_BUCKET: ${{ vars.AWS_TERRAFORM_STATE_BUCKET }}
      EKS_LEASE_KEY: ci/${{ github.ref == 'refs/heads/main' && 'production' || 'homolog' }}/eks-endpoint-lease.json
      ALLOW_DESTRUCTIVE: ${{ github.event_name == 'workflow_dispatch' && inputs.allow_destructive && 'true' || 'false' }}
      ALLOW_EKS_STATE_RECONCILIATION: ${{ github.ref == 'refs/heads/develop' && vars.ALLOW_EKS_STATE_RECONCILIATION == 'true' && 'true' || (github.event_name == 'workflow_dispatch' && inputs.approve_eks_state_reconciliation && 'true' || 'false') }}
      PLAN_ENCRYPTION_PASSPHRASE: ${{ secrets.TERRAFORM_PLAN_ENCRYPTION_PASSPHRASE }}
      AWS_EXPECTED_ACCOUNT_ID: ${{ vars.AWS_EXPECTED_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Validar configuração obrigatória antes do acesso AWS
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
          PLAN_ENCRYPTION_PASSPHRASE: ${{ secrets.TERRAFORM_PLAN_ENCRYPTION_PASSPHRASE }}
          GH_TOKEN: ${{ github.token }}
          APPROVAL_CONFIGURED: ${{ vars.TERRAFORM_APPLY_APPROVAL_CONFIGURED }}
        shell: bash
        run: |
          set -euo pipefail
          VARIABLE_NAMES=$(gh api --paginate "repos/$GITHUB_REPOSITORY/environments/$GITHUB_DEPLOYMENT_ENVIRONMENT/variables?per_page=30" --jq '.variables[].name')
          for name in AWS_REGION AWS_EXPECTED_ACCOUNT_ID AWS_TERRAFORM_STATE_BUCKET AWS_TF_STATE_KEY_INFRA TERRAFORM_APPLY_APPROVAL_CONFIGURED; do
            grep -Fxq -- "$name" <<< "$VARIABLE_NAMES" || { echo "A Variable $name precisa estar cadastrada no GitHub Environment selecionado." >&2; exit 1; }
          done
          SECRET_NAMES=$(gh api --paginate "repos/$GITHUB_REPOSITORY/environments/$GITHUB_DEPLOYMENT_ENVIRONMENT/secrets?per_page=100" --jq '.secrets[].name')
          for name in AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY AWS_SESSION_TOKEN TERRAFORM_PLAN_ENCRYPTION_PASSPHRASE; do
            grep -Fxq -- "$name" <<< "$SECRET_NAMES" || { echo "O Secret $name precisa estar cadastrado no GitHub Environment selecionado." >&2; exit 1; }
          done
          [[ "$AWS_EXPECTED_ACCOUNT_ID" =~ ^[0-9]{12}$ ]]
          [[ "$AWS_REGION" =~ ^[a-z]{2}(-gov)?-[a-z]+-[0-9]+$ ]]
          test -n "$AWS_ACCESS_KEY_ID"
          test -n "$AWS_SECRET_ACCESS_KEY"
          test -n "$AWS_SESSION_TOKEN"
          test -n "$TF_STATE_BUCKET"
          test -n "$TF_STATE_KEY"
          [[ "$TF_STATE_KEY" == "$GITHUB_DEPLOYMENT_ENVIRONMENT/"* ]]
          test -n "$PLAN_ENCRYPTION_PASSPHRASE"
          test "$APPROVAL_CONFIGURED" = true
          REVIEWERS=$(gh api "repos/$GITHUB_REPOSITORY/environments/$GITHUB_DEPLOYMENT_ENVIRONMENT" --jq '[.protection_rules[]? | select(.type == "required_reviewers") | .reviewers[]?] | length')
          test "$REVIEWERS" -gt 0
      - name: Registrar fingerprint do Environment e dos recursos VPC/EKS
        run: python scripts/terraform_deployment_fingerprint.py vpc-eks create infra/infra-deployment-config.sha256
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Conferir identidade, configurações e saída do runner
        id: runner
        shell: bash
        env:
          AWS_EXPECTED_ACCOUNT_ID: ${{ vars.AWS_EXPECTED_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          umask 077
          python scripts/verify_aws_account.py
          echo "ip=$(curl -4fsS https://checkip.amazonaws.com | tr -d '\n')" >> "$GITHUB_OUTPUT"
          test -n "$PLAN_ENCRYPTION_PASSPHRASE"
      - name: Descobrir e validar IAM Roles do EKS
        shell: bash
        run: |
          set -euo pipefail
          ROLES=$(python scripts/verify_eks_iam_roles.py --discover --cluster "$EKS_CLUSTER_NAME" --region "$AWS_REGION" --expected-account "$AWS_EXPECTED_ACCOUNT_ID")
          CLUSTER_ROLE_ARN=$(python -c 'import json,sys; print(json.load(sys.stdin)["cluster_role_arn"])' <<< "$ROLES")
          NODE_ROLE_ARN=$(python -c 'import json,sys; print(json.load(sys.stdin)["node_role_arn"])' <<< "$ROLES")
          {
            echo "AWS_EKS_CLUSTER_ROLE_ARN=$CLUSTER_ROLE_ARN"
            echo "AWS_EKS_NODE_ROLE_ARN=$NODE_ROLE_ARN"
            echo "TF_VAR_cluster_role_arn=$CLUSTER_ROLE_ARN"
            echo "TF_VAR_node_role_arn=$NODE_ROLE_ARN"
          } >> "$GITHUB_ENV"
      - name: Derivar role operador da sessão AWS atual
        run: |
          set -euo pipefail
          OPERATOR_ROLE_ARN=$(python scripts/discover_operator_access_role.py --expected-account "$AWS_EXPECTED_ACCOUNT_ID" --cluster-role-arn "$AWS_EKS_CLUSTER_ROLE_ARN" --node-role-arn "$AWS_EKS_NODE_ROLE_ARN")
          echo "TF_VAR_operator_access_role_arn=$OPERATOR_ROLE_ARN" >> "$GITHUB_ENV"
          echo "OPERATOR_ROLE_ARN=$OPERATOR_ROLE_ARN" >> "$GITHUB_ENV"
      - name: Detectar EKS antes do Plan
        id: eks_preflight
        run: python scripts/eks_cluster_preflight.py --cluster "$EKS_CLUSTER_NAME" --region "$AWS_REGION"
      - name: Verificar/bootstrap seguro do bucket de Terraform State
        env:
          AWS_EXPECTED_ACCOUNT_ID: ${{ vars.AWS_EXPECTED_ACCOUNT_ID }}
          AWS_TERRAFORM_STATE_BUCKET: ${{ vars.AWS_TERRAFORM_STATE_BUCKET }}
          AWS_REGION: ${{ vars.AWS_REGION }}
          APPROVE_CREATE: ${{ github.ref == 'refs/heads/develop' && vars.APPROVE_CREATE == 'true' && 'true' || (github.event_name == 'workflow_dispatch' && inputs.approve_state_bucket_creation && 'true' || 'false') }}
        run: |
          if [ "$APPROVE_CREATE" = true ]; then python scripts/bootstrap_state_bucket.py --approve-create; else python scripts/bootstrap_state_bucket.py; fi
      - name: Autorizar IP público exclusivo no EKS e aguardar atualização
        id: authorize_eks
        if: steps.eks_preflight.outputs.exists == 'true'
        env:
          RUNNER_IP: ${{ steps.runner.outputs.ip }}
        run: python scripts/eks_endpoint_access.py authorize --ip "$RUNNER_IP" --region "$AWS_REGION" --cluster "$EKS_CLUSTER_NAME"
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.16.5"
          terraform_wrapper: false
      - name: Inicializar Terraform
        env:
          AWS_TERRAFORM_STATE_BUCKET: ${{ vars.AWS_TERRAFORM_STATE_BUCKET }}
          AWS_TF_STATE_KEY_INFRA: ${{ vars.AWS_TF_STATE_KEY_INFRA }}
        run: |
          set -euo pipefail
          python scripts/state_resource_guard.py --bucket "$AWS_TERRAFORM_STATE_BUCKET" --key "$AWS_TF_STATE_KEY_INFRA" -- aws eks describe-cluster --name "$EKS_CLUSTER_NAME" --region "$AWS_REGION" --query cluster.name --output text
          cd infra
          rm -rf .terraform/providers
          terraform init -input=false -lockfile=readonly -reconfigure -backend-config="bucket=$TF_STATE_BUCKET" -backend-config="key=$TF_STATE_KEY" -backend-config="region=$AWS_REGION" -backend-config="expected_bucket_owner=$AWS_EXPECTED_ACCOUNT_ID" -backend-config="encrypt=true" -backend-config="use_lockfile=true"
      - name: Bloquear Plan legado enquanto houver ownership New Relic
        run: |
          set -euo pipefail
          umask 077
          if aws s3api head-object --bucket "$TF_STATE_BUCKET" --key "$TF_STATE_KEY" --expected-bucket-owner "$AWS_EXPECTED_ACCOUNT_ID" >/dev/null 2>"$RUNNER_TEMP/legacy-head-error"; then
            terraform -chdir=infra state pull > "$RUNNER_TEMP/legacy-infra-state.json"
          elif grep -Eqi '404|NoSuchKey|Not Found' "$RUNNER_TEMP/legacy-head-error"; then
            printf '{"version":4,"resources":[]}\n' > "$RUNNER_TEMP/legacy-infra-state.json"
          else
            echo "Não foi possível confirmar o state legado; Plan bloqueado." >&2
            exit 1
          fi
          rm -f "$RUNNER_TEMP/legacy-head-error"
          chmod 600 "$RUNNER_TEMP/legacy-infra-state.json"
          python scripts/newrelic_state_guard.py --legacy-only --old-state "$RUNNER_TEMP/legacy-infra-state.json"
          rm -f "$RUNNER_TEMP/legacy-infra-state.json"
      - name: Preparar imports declarativos da rede EKS
        run: python scripts/prepare_eks_network_imports.py --expected-account "$AWS_EXPECTED_ACCOUNT_ID" --region "$AWS_REGION" --project-name "$TF_VAR_project_name" --allow-reconciliation "$ALLOW_EKS_STATE_RECONCILIATION" --output infra/eks-network-imports.auto.tf
      - name: Preparar imports declarativos de acesso EKS
        run: python scripts/prepare_eks_access_imports.py --cluster "$EKS_CLUSTER_NAME" --principal "$OPERATOR_ROLE_ARN" --region "$AWS_REGION" --allow-imports "$ALLOW_EKS_STATE_RECONCILIATION" --output infra/eks-access-imports.auto.tf
      - name: Diagnosticar integridade dos providers Terraform
        working-directory: infra
        run: python ../scripts/diagnose_terraform_providers.py
      - name: Gerar plan e registrar ações de destruição/substituição
        id: plan
        env:
          EKS_EXISTS: ${{ steps.eks_preflight.outputs.exists }}
          EKS_CLUSTER_EXISTS: ${{ steps.eks_preflight.outputs.exists }}
        working-directory: infra
        run: |
          set -euo pipefail
          PLAN_ARGS=()
          terraform plan -input=false -no-color "${PLAN_ARGS[@]}" -out=infra.tfplan
          terraform show -json infra.tfplan > infra-plan.json
          python ../scripts/verify_eks_iam_roles.py --plan-json infra-plan.json --cluster "$EKS_CLUSTER_NAME" --region "$AWS_REGION" --expected-account "$AWS_EXPECTED_ACCOUNT_ID"
          python ../scripts/newrelic_pipeline_guard.py check-legacy-plan infra-plan.json
          python ../scripts/review_eks_plan.py infra-plan.json --allow-destructive "$ALLOW_DESTRUCTIVE"
          if [[ "$GITHUB_REF" == refs/heads/develop || "$GITHUB_REF" == refs/heads/main ]]; then
            printf '%s' "$GITHUB_SHA" > infra.tfplan.commit
            printf '%s\n' "$PLAN_ENCRYPTION_PASSPHRASE" | gpg --batch --yes --pinentry-mode loopback --passphrase-fd 0 --symmetric --cipher-algo AES256 --output infra.tfplan.gpg infra.tfplan
            python -c 'import json,os; json.dump({"run_id":os.environ["GITHUB_RUN_ID"],"run_attempt":os.environ["GITHUB_RUN_ATTEMPT"],"commit":os.environ["GITHUB_SHA"]}, open("infra.tfplan.metadata.json", "w", encoding="utf-8"), sort_keys=True)'
            sha256sum infra.tfplan.gpg infra.tfplan.commit infra.tfplan.metadata.json infra-deployment-config.sha256 > infra.tfplan.sha256
          fi
          rm -f infra.tfplan infra-plan.json
      - name: Remover autorização temporária
        if: always() && steps.authorize_eks.outcome != 'skipped'
        run: |
          python scripts/eks_endpoint_access.py cleanup --region "$AWS_REGION" --cluster "$EKS_CLUSTER_NAME"
          rm -f "$RUNNER_TEMP/legacy-infra-state.json" "$RUNNER_TEMP/legacy-head-error"
      - name: Publicar artifact criptografado da execução
        if: success() && (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main')
        uses: actions/upload-artifact@v4
        with:
          name: infra-tfplan-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}
          path: |
            infra/infra.tfplan.gpg
            infra/infra.tfplan.commit
            infra/infra.tfplan.sha256
            infra/infra.tfplan.metadata.json
            infra/infra-deployment-config.sha256
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  apply:
    name: Terraform Apply protegido por environment
    if: (((github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main') && github.event_name == 'push') || ((github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main') && github.event_name == 'workflow_dispatch' && inputs.apply)) && (github.ref != 'refs/heads/main' || github.ref_protected)
    needs: plan
    runs-on: ubuntu-latest
    environment: ${{ github.ref == 'refs/heads/main' && 'production' || 'homolog' }}
    env:
      GITHUB_DEPLOYMENT_ENVIRONMENT: ${{ github.ref == 'refs/heads/main' && 'production' || 'homolog' }}
      AWS_REGION: ${{ vars.AWS_REGION }}
      TF_STATE_BUCKET: ${{ vars.AWS_TERRAFORM_STATE_BUCKET }}
      TF_STATE_KEY: ${{ vars.AWS_TF_STATE_KEY_INFRA }}
      TF_VAR_aws_allowed_account_ids: '["${{ vars.AWS_EXPECTED_ACCOUNT_ID }}"]'
      TF_VAR_region_default: ${{ vars.AWS_REGION }}
      TF_VAR_project_name: ${{ github.ref == 'refs/heads/main' && 'autoflow-production' || 'autoflow' }}
      EKS_CLUSTER_NAME: eks-${{ github.ref == 'refs/heads/main' && 'autoflow-production' || 'autoflow' }}
      EKS_LEASE_BUCKET: ${{ vars.AWS_TERRAFORM_STATE_BUCKET }}
      EKS_LEASE_KEY: ci/${{ github.ref == 'refs/heads/main' && 'production' || 'homolog' }}/eks-endpoint-lease.json
      ALLOW_DESTRUCTIVE: ${{ github.event_name == 'workflow_dispatch' && inputs.allow_destructive && 'true' || 'false' }}
      ALLOW_EKS_STATE_RECONCILIATION: ${{ github.ref == 'refs/heads/develop' && vars.ALLOW_EKS_STATE_RECONCILIATION == 'true' && 'true' || (github.event_name == 'workflow_dispatch' && inputs.approve_eks_state_reconciliation && 'true' || 'false') }}
      PLAN_ENCRYPTION_PASSPHRASE: ${{ secrets.TERRAFORM_PLAN_ENCRYPTION_PASSPHRASE }}
      AWS_EXPECTED_ACCOUNT_ID: ${{ vars.AWS_EXPECTED_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Exigir Required reviewers efetivos no environment selecionado
        env:
          GH_TOKEN: ${{ github.token }}
          APPROVAL_CONFIGURED: ${{ vars.TERRAFORM_APPLY_APPROVAL_CONFIGURED }}
          AWS_EXPECTED_ACCOUNT_ID: ${{ vars.AWS_EXPECTED_ACCOUNT_ID }}
          AWS_REGION: ${{ vars.AWS_REGION }}
          AWS_TERRAFORM_STATE_BUCKET: ${{ vars.AWS_TERRAFORM_STATE_BUCKET }}
          AWS_TF_STATE_KEY_INFRA: ${{ vars.AWS_TF_STATE_KEY_INFRA }}
          PLAN_ENCRYPTION_PASSPHRASE: ${{ secrets.TERRAFORM_PLAN_ENCRYPTION_PASSPHRASE }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
        run: |
          set -euo pipefail
          VARIABLE_NAMES=$(gh api --paginate "repos/$GITHUB_REPOSITORY/environments/$GITHUB_DEPLOYMENT_ENVIRONMENT/variables?per_page=30" --jq '.variables[].name')
          for name in AWS_REGION AWS_EXPECTED_ACCOUNT_ID AWS_TERRAFORM_STATE_BUCKET AWS_TF_STATE_KEY_INFRA TERRAFORM_APPLY_APPROVAL_CONFIGURED; do
            grep -Fxq -- "$name" <<< "$VARIABLE_NAMES" || { echo "A Variable $name precisa estar cadastrada no GitHub Environment selecionado." >&2; exit 1; }
          done
          SECRET_NAMES=$(gh api --paginate "repos/$GITHUB_REPOSITORY/environments/$GITHUB_DEPLOYMENT_ENVIRONMENT/secrets?per_page=100" --jq '.secrets[].name')
          for name in AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY AWS_SESSION_TOKEN TERRAFORM_PLAN_ENCRYPTION_PASSPHRASE; do
            grep -Fxq -- "$name" <<< "$SECRET_NAMES" || { echo "O Secret $name precisa estar cadastrado no GitHub Environment selecionado." >&2; exit 1; }
          done
          test "$APPROVAL_CONFIGURED" = true
          REVIEWERS=$(gh api "repos/$GITHUB_REPOSITORY/environments/$GITHUB_DEPLOYMENT_ENVIRONMENT" --jq '[.protection_rules[]? | select(.type == "required_reviewers") | .reviewers[]?] | length')
          test "$REVIEWERS" -gt 0
          [[ "$AWS_EXPECTED_ACCOUNT_ID" =~ ^[0-9]{12}$ ]]
          [[ "$AWS_REGION" =~ ^[a-z]{2}(-gov)?-[a-z]+-[0-9]+$ ]]
          test -n "$AWS_TERRAFORM_STATE_BUCKET"
          [[ "$AWS_TF_STATE_KEY_INFRA" == "$GITHUB_DEPLOYMENT_ENVIRONMENT/"* ]]
          test -n "$PLAN_ENCRYPTION_PASSPHRASE"
          test -n "$AWS_ACCESS_KEY_ID"
          test -n "$AWS_SECRET_ACCESS_KEY"
          test -n "$AWS_SESSION_TOKEN"
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.16.5"
          terraform_wrapper: false
      - uses: actions/download-artifact@v4
        with:
          name: infra-tfplan-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}
          path: infra
      - name: Validar fingerprint, run, commit e integridade antes de qualquer acesso AWS
        working-directory: infra
        run: |
          set -euo pipefail
          test "$(cat infra.tfplan.commit)" = "$GITHUB_SHA"
          python -c 'import json,os,sys; m=json.load(open("infra.tfplan.metadata.json", encoding="utf-8")); sys.exit(not (m == {"run_id":os.environ["GITHUB_RUN_ID"],"run_attempt":os.environ["GITHUB_RUN_ATTEMPT"],"commit":os.environ["GITHUB_SHA"]}))'
          sha256sum --check infra.tfplan.sha256
          python ../scripts/terraform_deployment_fingerprint.py vpc-eks verify infra-deployment-config.sha256
      - name: Descriptografar plan deste run aprovado
        working-directory: infra
        env:
          PLAN_ENCRYPTION_PASSPHRASE: ${{ secrets.TERRAFORM_PLAN_ENCRYPTION_PASSPHRASE }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$PLAN_ENCRYPTION_PASSPHRASE"
          printf '%s\n' "$PLAN_ENCRYPTION_PASSPHRASE" | gpg --batch --yes --pinentry-mode loopback --passphrase-fd 0 --decrypt --output infra.tfplan infra.tfplan.gpg
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Validar identidade da conta AWS para Apply
        env:
          AWS_EXPECTED_ACCOUNT_ID: ${{ vars.AWS_EXPECTED_ACCOUNT_ID }}
        run: python scripts/verify_aws_account.py
      - name: Autorizar IP deste runner para Apply
        id: runner
        run: |
          set -euo pipefail
          echo "ip=$(curl -4fsS https://checkip.amazonaws.com | tr -d '\n')" >> "$GITHUB_OUTPUT"
      - name: Detectar EKS antes do Apply
        id: eks_preflight
        run: python scripts/eks_cluster_preflight.py --cluster "$EKS_CLUSTER_NAME" --region "$AWS_REGION"
      - name: Atualizar endpoint e aguardar conclusão
        id: authorize_eks
        if: steps.eks_preflight.outputs.exists == 'true'
        env:
          RUNNER_IP: ${{ steps.runner.outputs.ip }}
        run: python scripts/eks_endpoint_access.py authorize --ip "$RUNNER_IP" --region "$AWS_REGION" --cluster "$EKS_CLUSTER_NAME"
      - name: Inicializar Terraform
        working-directory: infra
        run: |
          set -euo pipefail
          rm -rf .terraform/providers
          terraform init -input=false -lockfile=readonly -reconfigure -backend-config="bucket=$TF_STATE_BUCKET" -backend-config="key=$TF_STATE_KEY" -backend-config="region=$AWS_REGION" -backend-config="expected_bucket_owner=$AWS_EXPECTED_ACCOUNT_ID" -backend-config="encrypt=true" -backend-config="use_lockfile=true"
      - name: Validar e reutilizar roles contidas no Plan aprovado
        working-directory: infra
        run: |
          set -euo pipefail
          terraform show -json infra.tfplan > infra-plan-roles.json
          ROLES=$(python ../scripts/verify_eks_iam_roles.py --plan-json infra-plan-roles.json --cluster "$EKS_CLUSTER_NAME" --region "$AWS_REGION" --expected-account "$AWS_EXPECTED_ACCOUNT_ID")
          CLUSTER_ROLE_ARN=$(python -c 'import json,sys; print(json.load(sys.stdin)["cluster_role_arn"])' <<< "$ROLES")
          NODE_ROLE_ARN=$(python -c 'import json,sys; print(json.load(sys.stdin)["node_role_arn"])' <<< "$ROLES")
          {
            echo "AWS_EKS_CLUSTER_ROLE_ARN=$CLUSTER_ROLE_ARN"
            echo "AWS_EKS_NODE_ROLE_ARN=$NODE_ROLE_ARN"
            echo "TF_VAR_cluster_role_arn=$CLUSTER_ROLE_ARN"
            echo "TF_VAR_node_role_arn=$NODE_ROLE_ARN"
          } >> "$GITHUB_ENV"
          rm -f infra-plan-roles.json
      - name: Derivar role operador da sessão AWS atual
        run: |
          set -euo pipefail
          OPERATOR_ROLE_ARN=$(python scripts/discover_operator_access_role.py --expected-account "$AWS_EXPECTED_ACCOUNT_ID" --cluster-role-arn "$AWS_EKS_CLUSTER_ROLE_ARN" --node-role-arn "$AWS_EKS_NODE_ROLE_ARN")
          echo "TF_VAR_operator_access_role_arn=$OPERATOR_ROLE_ARN" >> "$GITHUB_ENV"
          echo "OPERATOR_ROLE_ARN=$OPERATOR_ROLE_ARN" >> "$GITHUB_ENV"
      - name: Confirmar ausência de ownership New Relic no state legado
        run: |
          set -euo pipefail
          umask 077
          if aws s3api head-object --bucket "$TF_STATE_BUCKET" --key "$TF_STATE_KEY" --expected-bucket-owner "$AWS_EXPECTED_ACCOUNT_ID" >/dev/null 2>"$RUNNER_TEMP/legacy-head-error"; then
            terraform -chdir=infra state pull > "$RUNNER_TEMP/legacy-infra-state.json"
          elif grep -Eqi '404|NoSuchKey|Not Found' "$RUNNER_TEMP/legacy-head-error"; then
            printf '{"version":4,"resources":[]}\n' > "$RUNNER_TEMP/legacy-infra-state.json"
          else
            echo "Não foi possível confirmar o state legado; Apply bloqueado." >&2
            exit 1
          fi
          rm -f "$RUNNER_TEMP/legacy-head-error"
          chmod 600 "$RUNNER_TEMP/legacy-infra-state.json"
          python scripts/newrelic_state_guard.py --legacy-only --old-state "$RUNNER_TEMP/legacy-infra-state.json"
          rm -f "$RUNNER_TEMP/legacy-infra-state.json"
      - name: Preparar imports declarativos usados pelo plan aprovado
        run: |
          set -euo pipefail
          python scripts/prepare_eks_network_imports.py --expected-account "$AWS_EXPECTED_ACCOUNT_ID" --region "$AWS_REGION" --project-name "$TF_VAR_project_name" --allow-reconciliation "$ALLOW_EKS_STATE_RECONCILIATION" --output infra/eks-network-imports.auto.tf
          python scripts/prepare_eks_access_imports.py --cluster "$EKS_CLUSTER_NAME" --principal "$OPERATOR_ROLE_ARN" --region "$AWS_REGION" --allow-imports "$ALLOW_EKS_STATE_RECONCILIATION" --output infra/eks-access-imports.auto.tf
      - name: Inspecionar plan aprovado e validar guards
        working-directory: infra
        env:
          EKS_CLUSTER_EXISTS: ${{ steps.eks_preflight.outputs.exists }}
        run: |
          set -euo pipefail
          terraform show -json infra.tfplan > infra-plan.json
          python ../scripts/newrelic_pipeline_guard.py check-legacy-plan infra-plan.json
          python ../scripts/review_eks_plan.py infra-plan.json --allow-destructive "$ALLOW_DESTRUCTIVE"
          rm -f infra-plan.json
      - name: Aplicar plan aprovado
        working-directory: infra
        run: terraform apply -input=false infra.tfplan
      - name: Limpar CIDR temporário mesmo após falha
        if: always() && steps.authorize_eks.outcome != 'skipped'
        run: |
          python scripts/eks_endpoint_access.py cleanup --region "$AWS_REGION" --cluster "$EKS_CLUSTER_NAME"
          rm -f "$RUNNER_TEMP/legacy-infra-state.json" "$RUNNER_TEMP/legacy-head-error" infra/infra.tfplan infra/infra.tfplan.gpg infra/infra.tfplan.commit infra/infra.tfplan.metadata.json infra/infra.tfplan.sha256 infra/infra-deployment-config.sha256
