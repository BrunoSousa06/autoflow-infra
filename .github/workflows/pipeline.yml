name: Pipeline

on:
  push:
    branches: ["develop", "main"]

  pull_request:
    types: [opened, synchronize, reopened]
    branches: ["develop", "main"]

jobs:

  deploy-aws:
    name: Deploy Infra with Terraform
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    concurrency:
      group: autoflow-platform-develop
      cancel-in-progress: false
    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
      TF_STATE_BUCKET: ${{ vars.AWS_TERRAFORM_STATE_BUCKET }}
      TF_STATE_KEY: ${{ vars.AWS_TF_STATE_KEY_INFRA }}
      TF_VAR_aws_allowed_account_ids: '["${{ vars.AWS_EXPECTED_ACCOUNT_ID }}"]'
      TF_VAR_region_default: ${{ vars.AWS_REGION || 'us-east-1' }}
      TF_VAR_cluster_role_arn: ${{ vars.AWS_EKS_CLUSTER_ROLE_ARN }}
      TF_VAR_node_role_arn: ${{ vars.AWS_EKS_NODE_ROLE_ARN }}
      TF_VAR_operator_access_role_arn: ${{ vars.AWS_EKS_OPERATOR_ACCESS_ROLE_ARN }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Test AWS account identity guard
        run: python -m unittest discover -s scripts -p "test_verify_aws_account.py" -v

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Verify expected AWS account
        env:
          AWS_EXPECTED_ACCOUNT_ID: ${{ vars.AWS_EXPECTED_ACCOUNT_ID }}
        run: python scripts/verify_aws_account.py

      - name: Confirmar bucket Terraform previamente configurado
        env:
          TF_STATE_BUCKET: ${{ vars.AWS_TERRAFORM_STATE_BUCKET }}
          TF_STATE_KEY: ${{ vars.AWS_TF_STATE_KEY_INFRA }}
        run: |
          test -n "$TF_STATE_BUCKET"
          test -n "$TF_STATE_KEY"
          aws s3api head-bucket --bucket "$TF_STATE_BUCKET"
          aws s3api head-object --bucket "$TF_STATE_BUCKET" --key "$TF_STATE_KEY" > /dev/null

      - name: Terraform Init
        working-directory: ./infra
        run: terraform init -input=false -reconfigure -backend-config="bucket=${TF_STATE_BUCKET}" -backend-config="key=${TF_STATE_KEY}" -backend-config="region=${AWS_REGION}" -backend-config="encrypt=true" -backend-config="use_lockfile=true"

      - name: Terraform Validate
        working-directory: ./infra
        run: terraform validate

      - name: Terraform Plan
        working-directory: ./infra
        run: terraform plan

      - name: Terraform Apply
        working-directory: ./infra
        run: terraform apply -auto-approve

  deploy-kong:
    name: Validate and deploy Kong OSS + KIC
    runs-on: ubuntu-latest
    needs: deploy-aws
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    concurrency:
      group: autoflow-platform-develop
      cancel-in-progress: false
    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
      TF_STATE_BUCKET: ${{ vars.AWS_TERRAFORM_STATE_BUCKET }}
      TF_STATE_KEY: ${{ vars.AWS_TF_STATE_KEY_KONG }}
      TF_VAR_aws_allowed_account_ids: '["${{ vars.AWS_EXPECTED_ACCOUNT_ID }}"]'
      TF_VAR_aws_region: ${{ vars.AWS_REGION || 'us-east-1' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Test AWS account identity guard
        run: python -m unittest discover -s scripts -p "test_verify_aws_account.py" -v

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Setup Helm CLI
        uses: azure/setup-helm@v5.0.1
        with:
          version: v3.19.0

      - name: Lint and render pinned Kong chart and CRDs
        working-directory: ./infra/kong
        run: bash ./validate.sh

      - name: Verify aws-lambda is present in the pinned OSS image
        run: >-
          docker run --rm --entrypoint /bin/sh
          kong:3.9.3@sha256:92035d16d7ff86b7bc12fb1d0090d29357d924238b1880f78735f3f2fea6b631
          -c 'test -f /usr/local/share/lua/5.1/kong/plugins/aws-lambda/handler.lua'

      - name: Verify expected AWS account
        env:
          AWS_EXPECTED_ACCOUNT_ID: ${{ vars.AWS_EXPECTED_ACCOUNT_ID }}
        run: python scripts/verify_aws_account.py

      - name: Confirmar bucket Terraform previamente configurado
        env:
          TF_STATE_BUCKET: ${{ vars.AWS_TERRAFORM_STATE_BUCKET }}
          TF_STATE_KEY: ${{ vars.AWS_TF_STATE_KEY_KONG }}
        run: |
          test -n "$TF_STATE_BUCKET"
          test -n "$TF_STATE_KEY"
          aws s3api head-bucket --bucket "$TF_STATE_BUCKET"
          aws s3api head-object --bucket "$TF_STATE_BUCKET" --key "$TF_STATE_KEY" > /dev/null

      - name: Terraform Init
        working-directory: ./infra/kong
        run: terraform init -input=false -reconfigure -backend-config="bucket=${TF_STATE_BUCKET}" -backend-config="key=${TF_STATE_KEY}" -backend-config="region=${AWS_REGION}" -backend-config="encrypt=true" -backend-config="use_lockfile=true"

      - name: Terraform Validate
        working-directory: ./infra/kong
        run: terraform validate

      - name: Terraform Plan
        working-directory: ./infra/kong
        run: terraform plan -input=false

      - name: Terraform Apply Kong Helm release
        working-directory: ./infra/kong
        run: terraform apply -input=false -auto-approve

