name: Migração HTTP API

on:
  pull_request:
    branches: [develop, main]
    paths: ["infra/api-gateway/**", "scripts/*gateway*", ".github/workflows/api-gateway.yml"]
  push:
    branches: [develop, main, 'feature/**']
    paths: ["infra/api-gateway/**", "scripts/*gateway*", ".github/workflows/api-gateway.yml"]
  workflow_dispatch:
    inputs:
      allow_destructive:
        description: Autorizar exclusões e substituições neste plan
        required: false
        type: boolean
        default: false
      enable_detailed_gateway_metrics:
        description: Habilitar métricas CloudWatch detalhadas por rota (pode gerar custo adicional)
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

concurrency:
  group: autoflow-api-gateway-homolog
  cancel-in-progress: false

jobs:
  validate:
    name: CI API Gateway
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: ${{ vars.AUTOFLOW_REPOSITORY || format('{0}/autoflow', github.repository_owner) }}
          ref: ${{ vars.AUTOFLOW_CONTRACT_REF || 'develop' }}
          path: .contract-autoflow
          token: ${{ secrets.AUTOFLOW_READ_TOKEN || github.token }}
      - name: Confrontar allowlist com controllers
        env:
          AUTOFLOW_REPO: ${{ github.workspace }}/.contract-autoflow
        run: python -m unittest discover -s scripts -p test_gateway_routes.py -v
      - name: Testar imports do VPC Link sem State
        run: python -m unittest discover -s scripts -p test_prepare_gateway_imports.py -v
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.16.5"
          terraform_wrapper: false
      - run: terraform -chdir=infra/api-gateway fmt -check -recursive
      - run: terraform -chdir=infra/api-gateway init -backend=false -input=false
      - run: terraform -chdir=infra/api-gateway validate
      - run: terraform -chdir=infra/api-gateway test
      - run: terraform -chdir=infra/api-gateway/modules/private-eks init -backend=false -input=false
      - run: terraform -chdir=infra/api-gateway/modules/private-eks test

  plan:
    name: Terraform Plan homolog
    if: github.ref == 'refs/heads/develop' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: validate
    runs-on: ubuntu-latest
    environment: homolog
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      TF_VAR_aws_region: ${{ vars.AWS_REGION }}
      TF_VAR_expected_account_id: ${{ vars.AWS_EXPECTED_ACCOUNT_ID }}
      TF_VAR_terraform_state_bucket: ${{ vars.AWS_TERRAFORM_STATE_BUCKET }}
      TF_VAR_infra_state_key: ${{ vars.AWS_TF_STATE_KEY_INFRA }}
      TF_VAR_enable_detailed_gateway_metrics: ${{ github.event_name == 'workflow_dispatch' && inputs.enable_detailed_gateway_metrics && 'true' || 'false' }}
      TF_VAR_cors_origins: ${{ vars.API_GATEWAY_CORS_ORIGINS }}
      TF_STATE_KEY: ${{ vars.AWS_TF_STATE_KEY_GATEWAY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Exigir credenciais temporárias e CORS explícito
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
          API_GATEWAY_CORS_ORIGINS: ${{ vars.API_GATEWAY_CORS_ORIGINS }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$AWS_ACCESS_KEY_ID"
          test -n "$AWS_SECRET_ACCESS_KEY"
          test -n "$AWS_SESSION_TOKEN"
          [[ "$AWS_REGION" =~ ^[a-z]{2}(-gov)?-[a-z]+-[0-9]+$ ]]
          test -n "$TF_VAR_expected_account_id"
          test -n "$TF_STATE_KEY"
          test -n "$TF_VAR_terraform_state_bucket"
          test -n "$TF_VAR_infra_state_key"
          test -n "$API_GATEWAY_CORS_ORIGINS"
          python -c 'import json,os,sys; value=json.loads(os.environ["API_GATEWAY_CORS_ORIGINS"]); sys.exit(not isinstance(value,list))'
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Verificar sessão, conta, EKS e node group
        shell: bash
        run: |
          set -euo pipefail
          test "$(aws sts get-caller-identity --query Account --output text)" = "$TF_VAR_expected_account_id"
          test "$(aws ec2 describe-availability-zones --region "$AWS_REGION" --query 'AvailabilityZones[0].RegionName' --output text)" = "$AWS_REGION"
          aws s3api head-bucket --bucket "$TF_VAR_terraform_state_bucket"
          mapfile -t LAMBDA_FUNCTIONS < <(aws lambda list-functions --region "$AWS_REGION" --query "Functions[?FunctionName=='autoflow-cpf-validator-homolog'].FunctionName" --output text | tr '\t' '\n' | sed '/^$/d;/^None$/d')
          test "${#LAMBDA_FUNCTIONS[@]}" -eq 1 || { echo "A função Lambda autoflow-cpf-validator-homolog não foi encontrada de forma única." >&2; exit 1; }
          printf 'TF_VAR_lambda_function_name=%s\n' "${LAMBDA_FUNCTIONS[0]}" >> "$GITHUB_ENV"
          mapfile -t CLUSTERS < <(aws eks list-clusters --region "$AWS_REGION" --query 'clusters[]' --output text | tr '\t' '\n' | sed '/^$/d')
          test "${#CLUSTERS[@]}" -eq 1 || { echo "Esperado exatamente um cluster EKS na conta/região; encontrados ${#CLUSTERS[@]}." >&2; exit 1; }
          TF_VAR_cluster_name="${CLUSTERS[0]}"
          mapfile -t NODEGROUPS < <(aws eks list-nodegroups --cluster-name "$TF_VAR_cluster_name" --region "$AWS_REGION" --query 'nodegroups[]' --output text | tr '\t' '\n' | sed '/^$/d')
          test "${#NODEGROUPS[@]}" -eq 1 || { echo "Esperado exatamente um node group no cluster; encontrados ${#NODEGROUPS[@]}." >&2; exit 1; }
          TF_VAR_nodegroup_name="${NODEGROUPS[0]}"
          printf 'TF_VAR_cluster_name=%s\nTF_VAR_nodegroup_name=%s\n' "$TF_VAR_cluster_name" "$TF_VAR_nodegroup_name" >> "$GITHUB_ENV"
          INFRA_STATE_STATUS=$(python scripts/state_resource_guard.py --bucket "$TF_VAR_terraform_state_bucket" --key "$TF_VAR_infra_state_key" -- aws eks describe-cluster --name "$TF_VAR_cluster_name" --region "$AWS_REGION" --query cluster.name --output text)
          if [ "$INFRA_STATE_STATUS" != state-present ]; then
            echo "Pré-requisito ausente: State EKS e cluster não encontrados. Execute e aplique primeiro o pipeline autoflow-infra; o API Gateway depende de eks/terraform.tfstate." >&2
            exit 1
          fi
          test "$(aws eks describe-cluster --name "$TF_VAR_cluster_name" --region "$AWS_REGION" --query cluster.status --output text)" = ACTIVE
          test "$(aws eks describe-nodegroup --cluster-name "$TF_VAR_cluster_name" --nodegroup-name "$TF_VAR_nodegroup_name" --region "$AWS_REGION" --query nodegroup.status --output text)" = ACTIVE
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.16.5"
          terraform_wrapper: false
      - name: Inicializar state exclusivo do gateway
        env:
          AWS_TERRAFORM_STATE_BUCKET: ${{ vars.AWS_TERRAFORM_STATE_BUCKET }}
          AWS_TF_STATE_KEY_GATEWAY: ${{ vars.AWS_TF_STATE_KEY_GATEWAY }}
        run: |
          python scripts/state_resource_guard.py --bucket "$AWS_TERRAFORM_STATE_BUCKET" --key "$AWS_TF_STATE_KEY_GATEWAY" -- aws apigatewayv2 get-apis --query "Items[?Name=='autoflow-homolog'].ApiId | [0]" --output text
          python scripts/state_resource_guard.py --bucket "$AWS_TERRAFORM_STATE_BUCKET" --key "$AWS_TF_STATE_KEY_GATEWAY" -- aws elbv2 describe-load-balancers --names autoflow-homolog-private --query 'LoadBalancers[0].LoadBalancerArn' --output text
          cd infra/api-gateway
          terraform init -input=false -lockfile=readonly -backend-config="bucket=$TF_VAR_terraform_state_bucket" -backend-config="key=$TF_STATE_KEY" -backend-config="region=$AWS_REGION" -backend-config="encrypt=true" -backend-config="use_lockfile=true"
          cd ../..
          python scripts/prepare_gateway_imports.py --bucket "$TF_VAR_terraform_state_bucket" --key "$TF_STATE_KEY" --region "$AWS_REGION" --name autoflow-homolog --output infra/api-gateway/gateway-vpc-link-imports.auto.tf
      - name: Gerar e revisar plano
        working-directory: infra/api-gateway
        env:
          ALLOW_DESTRUCTIVE: ${{ github.ref == 'refs/heads/develop' && (github.event_name == 'push' && 'true' || (github.event_name == 'workflow_dispatch' && inputs.allow_destructive && 'true' || 'false')) || 'false' }}
        run: |
          terraform plan -input=false -out=gateway.tfplan
          ALLOW_DESTRUCTIVE="$ALLOW_DESTRUCTIVE" python ../../scripts/review_gateway_plan.py gateway.tfplan
          if [[ "$GITHUB_REF" == refs/heads/develop ]]; then sha256sum gateway.tfplan .terraform.lock.hcl > gateway.tfplan.sha256; else rm -f gateway.tfplan; fi
      - name: Publicar plano confidencial e imutável
        if: github.ref == 'refs/heads/develop'
        uses: actions/upload-artifact@v4
        with:
          name: gateway-tfplan-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            infra/api-gateway/gateway.tfplan
            infra/api-gateway/gateway.tfplan.sha256
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  apply:
    name: Terraform Apply homolog (aprovação requerida)
    if: github.ref == 'refs/heads/develop' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: plan
    runs-on: ubuntu-latest
    environment: homolog
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      TF_VAR_expected_account_id: ${{ vars.AWS_EXPECTED_ACCOUNT_ID }}
      TF_VAR_terraform_state_bucket: ${{ vars.AWS_TERRAFORM_STATE_BUCKET }}
      TF_VAR_infra_state_key: ${{ vars.AWS_TF_STATE_KEY_INFRA }}
      TF_VAR_enable_detailed_gateway_metrics: ${{ github.event_name == 'workflow_dispatch' && inputs.enable_detailed_gateway_metrics && 'true' || 'false' }}
      TF_STATE_KEY: ${{ vars.AWS_TF_STATE_KEY_GATEWAY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Exigir aprovação efetiva configurada no environment
        env:
          APPROVAL_CONFIGURED: ${{ vars.TERRAFORM_APPLY_APPROVAL_CONFIGURED }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$APPROVAL_CONFIGURED" = "true" || {
            echo "Configure Required reviewers no environment homolog e defina TERRAFORM_APPLY_APPROVAL_CONFIGURED=true." >&2
            exit 1
          }
          REVIEWERS=$(gh api "repos/$GITHUB_REPOSITORY/environments/homolog" --jq '[.protection_rules[]? | select(.type == "required_reviewers") | .reviewers[]?] | length')
          test "$REVIEWERS" -gt 0 || {
            echo "O environment homolog não possui Required reviewers efetivamente configurados; Apply bloqueado." >&2
            exit 1
          }
      - name: Exigir credenciais temporárias e configuração AWS
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$AWS_ACCESS_KEY_ID"
          test -n "$AWS_SECRET_ACCESS_KEY"
          test -n "$AWS_SESSION_TOKEN"
          [[ "$AWS_REGION" =~ ^[a-z]{2}(-gov)?-[a-z]+-[0-9]+$ ]]
          test -n "$TF_VAR_expected_account_id"
          test -n "$TF_STATE_KEY"
          test -n "$TF_VAR_terraform_state_bucket"
          test -n "$TF_VAR_infra_state_key"
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Revalidar conta, state, EKS e node group
        shell: bash
        run: |
          set -euo pipefail
          test "$(aws sts get-caller-identity --query Account --output text)" = "$TF_VAR_expected_account_id"
          test "$(aws ec2 describe-availability-zones --region "$AWS_REGION" --query 'AvailabilityZones[0].RegionName' --output text)" = "$AWS_REGION"
          aws s3api head-bucket --bucket "$TF_VAR_terraform_state_bucket"
          mapfile -t LAMBDA_FUNCTIONS < <(aws lambda list-functions --region "$AWS_REGION" --query "Functions[?FunctionName=='autoflow-cpf-validator-homolog'].FunctionName" --output text | tr '\t' '\n' | sed '/^$/d;/^None$/d')
          test "${#LAMBDA_FUNCTIONS[@]}" -eq 1 || { echo "A função Lambda autoflow-cpf-validator-homolog não foi encontrada de forma única." >&2; exit 1; }
          printf 'TF_VAR_lambda_function_name=%s\n' "${LAMBDA_FUNCTIONS[0]}" >> "$GITHUB_ENV"
          mapfile -t CLUSTERS < <(aws eks list-clusters --region "$AWS_REGION" --query 'clusters[]' --output text | tr '\t' '\n' | sed '/^$/d')
          test "${#CLUSTERS[@]}" -eq 1 || { echo "Esperado exatamente um cluster EKS na conta/região; encontrados ${#CLUSTERS[@]}." >&2; exit 1; }
          TF_VAR_cluster_name="${CLUSTERS[0]}"
          mapfile -t NODEGROUPS < <(aws eks list-nodegroups --cluster-name "$TF_VAR_cluster_name" --region "$AWS_REGION" --query 'nodegroups[]' --output text | tr '\t' '\n' | sed '/^$/d')
          test "${#NODEGROUPS[@]}" -eq 1 || { echo "Esperado exatamente um node group no cluster; encontrados ${#NODEGROUPS[@]}." >&2; exit 1; }
          TF_VAR_nodegroup_name="${NODEGROUPS[0]}"
          printf 'TF_VAR_cluster_name=%s\nTF_VAR_nodegroup_name=%s\n' "$TF_VAR_cluster_name" "$TF_VAR_nodegroup_name" >> "$GITHUB_ENV"
          INFRA_STATE_STATUS=$(python scripts/state_resource_guard.py --bucket "$TF_VAR_terraform_state_bucket" --key "$TF_VAR_infra_state_key" -- aws eks describe-cluster --name "$TF_VAR_cluster_name" --region "$AWS_REGION" --query cluster.name --output text)
          if [ "$INFRA_STATE_STATUS" != state-present ]; then
            echo "Pré-requisito ausente: State EKS e cluster não encontrados. Execute e aplique primeiro o pipeline autoflow-infra; o API Gateway depende de eks/terraform.tfstate." >&2
            exit 1
          fi
          test "$(aws eks describe-cluster --name "$TF_VAR_cluster_name" --region "$AWS_REGION" --query cluster.status --output text)" = ACTIVE
          test "$(aws eks describe-nodegroup --cluster-name "$TF_VAR_cluster_name" --nodegroup-name "$TF_VAR_nodegroup_name" --region "$AWS_REGION" --query nodegroup.status --output text)" = ACTIVE
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.16.5"
          terraform_wrapper: false
      - name: Download do plano desta execução
        uses: actions/download-artifact@v4
        with:
          name: gateway-tfplan-${{ github.run_id }}-${{ github.run_attempt }}
          path: infra/api-gateway
      - name: Verificar integridade do plano
        working-directory: infra/api-gateway
        run: sha256sum --check gateway.tfplan.sha256
      - name: Inicializar state exclusivo do gateway
        working-directory: infra/api-gateway
        run: terraform init -input=false -lockfile=readonly -backend-config="bucket=$TF_VAR_terraform_state_bucket" -backend-config="key=$TF_STATE_KEY" -backend-config="region=$AWS_REGION" -backend-config="encrypt=true" -backend-config="use_lockfile=true"
      - name: Aplicar exatamente o plano aprovado
        working-directory: infra/api-gateway
        run: terraform apply -input=false gateway.tfplan
      - name: Exibir endpoint
        working-directory: infra/api-gateway
        run: terraform output gateway_url
